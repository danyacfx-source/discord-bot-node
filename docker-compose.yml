services:
  bot:
    build:
      context: .
      args:
        PANEL_HOST: ${PANEL_HOST:-0.0.0.0}
    image: bot-node:latest
    container_name: bot-node
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PANEL_HOST=${PANEL_HOST:-0.0.0.0}
      - PANEL_PORT=${PANEL_PORT:-17890}
      - DB_DIR=/app/state
      - DATA_DIR=/app/state
    ports:
      - "${PANEL_HOST:-127.0.0.1}:${PANEL_PORT:-17890}:${PANEL_PORT:-17890}"
      - "${PANEL_HOST:-127.0.0.1}:8765:8765"
    volumes:
      - ./state:/app/state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PANEL_PORT||17890)+'/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s